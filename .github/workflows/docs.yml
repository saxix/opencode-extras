name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'properdocs.yml'
      - 'properdocs.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'properdocs.yml'
      - 'properdocs.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests (frontmatter validation)
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install docs build tools
        run: |
          uv pip install --system properdocs pymdown-extensions 2>&1 || pip install properdocs pymdown-extensions

      - name: Build docs
        run: properdocs build --strict

      - name: Upload site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          if-no-files-found: warn
