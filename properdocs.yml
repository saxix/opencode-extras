site_name: opencode-extras
site_description: Reusable agents, skills and commands for AI coding TUIs
site_author: saxix
site_url: https://saxix.github.io/opencode-extras/
repo_url: https://github.com/saxix/opencode-extras/
repo_name: saxix/opencode-extras
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: mkdocs
  locale: en

nav:
  - Home: index.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Getting Started: user-guide/getting-started.md
    - Navigation: user-guide/navigation.md
    - FAQ: user-guide/faq.md
    - Workflows:
      - Pipeline: user-guide/workflows/pipeline.md
      - Agents: user-guide/workflows/agents.md
      - Commands: user-guide/workflows/commands.md
  - Reference:
    - Agents: reference/agents.md
    - Skills: reference/skills.md
    - Commands: reference/commands.md
    - Plugins: reference/plugins.md
  - Maintainers:
    - Conventions: maintainers/conventions.md
    - Development: maintainers/development.md
    - CI: maintainers/ci.md
    - Releasing: maintainers/releasing.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list
  - def_list
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - javascripts/mermaid.mjs

plugins:
  - search
